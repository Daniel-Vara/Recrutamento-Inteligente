
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma de Vagas{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 14px;
        }

        main {
            width: min(460px, 92%);
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0000000d;
        }

        h1 { font-size: 26px; margin-top: 0; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        button, .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        button:hover, .button:hover { background: #1d4ed8; }

        .full-width { width: 100%; margin-top: 20px; }

        .errorlist, .error {
            color: #b91c1c;
            padding-left: 20px;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .links { margin-top: 18px; }
        .links a { color: #1d4ed8; }
        .muted { color: #6b7280; }
    </style>
</head>
<body>
    <header>
        <strong>Plataforma de Vagas</strong>
       
<nav>
    <a href="/">Início</a>

    {% if user.is_authenticated %}
        <span>Olá, {{ user.first_name|default:user.email }}</span>

        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:register' %}">Cadastro</a>
        <a href="{% url 'accounts:login' %}">Entrar</a>
    {% endif %}
</nav>

    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
